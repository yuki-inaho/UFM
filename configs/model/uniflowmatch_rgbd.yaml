# RGB-D variant of UniFlowMatchConfidence (ADR-14 Option C).
#
# This is an *additive* model config: the existing RGB model configs are left
# unchanged, and the RGB encoder/checkpoint keys obey the exact same names.  The
# only new module is `depth_fusion` (small metric-depth adapter + zero-init gate),
# so with `use_depth_fusion=false` (or gate == 0, or depth absent) the model is
# numerically identical to the RGB-only model.
defaults:
  - encoder: dinov2_l
  - decoder: base_global
  - feature_head: dpt
  - adaptor_map: flow_scale_both
  - uncertainty_adaptor_map: covisibility
  - uncertainty_feature_head: dpt

model_class: UniFlowMatchConfidence

data_norm_type: 'dinov2'
info_sharing_and_head_structure: 'dual+single'
num_channels: 2

# for decoder
returned_intermediate_layers: [5, 8]
transformer_dim: ${model.decoder.transformer_dim}
pretrained_backbone_checkpoint_path: null

detach_uncertainty_head: False

# --- depth fusion (RGB-D) -------------------------------------------------- #
use_depth_fusion: True
depth_fusion_kwargs:
  # last encoder feature channel count (dinov2_l -> 1024)
  feature_dim: ${model.encoder.encoder_embed}
  depth_hidden_dim: 64
  # must default to 0.0: guarantees exact RGB identity at initialisation
  gate_init: 0.0
  # loader window far bound in metres; metric depth is scaled to a bounded range
  depth_scale: 1.3

model_args:
  # Encoder Args
  encoder_str: ${model.encoder.encoder_str}
  encoder_kwargs: ${model.encoder.encoder_kwargs}
  # Info Sharing Args
  info_sharing_str: ${model.decoder.info_sharing_type}
  info_sharing_kwargs: ${model.decoder.info_sharing_kwargs}
  # Output Head Args
  head_type: dpt
  feature_head_kwargs: ${model.feature_head}
  adaptors_kwargs: ${model.adaptor_map}
  # Uncertainty Head Args
  detach_uncertainty_head: ${model.detach_uncertainty_head}
  uncertainty_head_type: dpt
  uncertainty_head_kwargs: ${model.uncertainty_feature_head}
  uncertainty_adaptors_kwargs: ${model.uncertainty_adaptor_map.adaptor_map_kwargs}
  # Depth Fusion Args (RGB-D)
  use_depth_fusion: ${model.use_depth_fusion}
  depth_fusion_kwargs: ${model.depth_fusion_kwargs}
  # Pretrained checkpoint path
  pretrained_backbone_checkpoint_path: ${model.pretrained_backbone_checkpoint_path}
  pretrained_checkpoint_path: null
