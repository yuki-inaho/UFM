# Dataset group: paired RGB-D fine-tuning (public defaults, generic id).
#
# `index_path` / `index_sha256` / `expected_train_pairs` / `expected_val_pairs` /
# `occlusion_supervision_path` are private and are supplied only by the external
# resolved config; the public config keeps them null so no host path, index sha,
# or real pair count leaks into tracked source.
name: paired_rgbd
index_path: null             # PRIVATE (Git-external)
index_sha256: null           # PRIVATE (Git-external)
expected_train_pairs: null   # PRIVATE: real count from the external config
expected_val_pairs: null     # PRIVATE: real count from the external config
# The held-out split is TEST_ONLY: never used for model/hyperparameter selection.
heldout_role: TEST_ONLY_NO_SELECTION

# UFM resolution is (W, H); must be a multiple of the encoder patch size 14.
resolution: [448, 336]
resolution_multiple: 14
data_norm_type: dinov2
transform: imgnorm

# metric depth + dilated window mask
depth_units: metre
depth_window_m: [0.0, 1.3]
already_dilated: true       # loader never dilates; double dilation forbidden
verify_hashes: true
occlusion_supervision_source: path
occlusion_supervision_path: null   # PRIVATE (Git-external)

loader:
  # 0 initially: prioritize resume consumed-cursor consistency over throughput.
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  batch_pairs: 1
  drop_last: false
